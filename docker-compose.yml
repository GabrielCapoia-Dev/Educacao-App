name: gestao-edu

services:
  db:
    image: gvenzl/oracle-free:23-slim
    environment:
      ORACLE_PASSWORD: ${ORACLE_SYS_PASSWORD:-OracleDev123}
      APP_USER: ${ORACLE_USER:-GESTAO_EDU}
      APP_USER_PASSWORD: ${ORACLE_PASSWORD:-GestaoEdu123}
    ports:
      - "${ORACLE_PORT:-1521}:1521"
    volumes:
      - oracle-data:/opt/oracle/oradata
      - ./back-type/database/plsql:/container-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "healthcheck.sh"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 60s

  api:
    build:
      context: ./back-type
      target: production
    environment:
      NODE_ENV: production
      PORT: 3000
      API_PREFIX: /api/v1
      ORACLE_USER: ${ORACLE_USER:-GESTAO_EDU}
      ORACLE_PASSWORD: ${ORACLE_PASSWORD:-GestaoEdu123}
      ORACLE_CONNECT_STRING: db:1521/FREEPDB1
      ORACLE_POOL_MIN: ${ORACLE_POOL_MIN:-1}
      ORACLE_POOL_MAX: ${ORACLE_POOL_MAX:-5}
      ORACLE_POOL_INCREMENT: ${ORACLE_POOL_INCREMENT:-1}
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "3000"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3000/api/v1/health/live').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  web:
    build:
      context: ./front-angular
      target: production
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-4200}:80"

volumes:
  oracle-data:
